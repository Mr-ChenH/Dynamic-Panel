<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>录屏状态 · Dynamic Panel</title>
  <link rel="stylesheet" href="recordingOverlay.css">
</head>
<body>
  <main class="recording-control" aria-label="录屏状态">
    <span class="recording-dot" aria-hidden="true"></span>
    <strong id="recording-time">准备中</strong>
    <button id="recording-stop" type="button" title="停止并保存" aria-label="停止并保存">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"></rect></svg>
    </button>
    <button id="recording-discard" type="button" title="取消并丢弃" aria-label="取消并丢弃">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12"></path><path d="m6 6 12 12"></path></svg>
    </button>
  </main>
  <script src="recordingOverlay.js"></script>
</body>
</html>
