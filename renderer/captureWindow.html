<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屏幕采集 · TO-DO Panel</title>
  <link rel="stylesheet" href="captureWindow.css">
</head>
<body>
  <main id="picker">
    <header><div><span class="eyebrow">TO-DO PANEL</span><h1 id="heading">选择采集来源</h1></div><button id="cancel" type="button">取消 · Esc</button></header>
    <div class="toolbar"><label>采集方式 <select id="type"><option value="region">框选区域</option><option value="screen">整个屏幕</option><option value="window">单个窗口</option></select></label><button id="refresh" type="button">刷新来源</button><span id="summary"></span></div>
    <p id="status" role="status">正在读取屏幕与窗口…</p>
    <div id="sources" role="group" aria-label="可采集的屏幕或窗口"></div>
    <footer><button id="privacy" type="button">屏幕录制权限设置</button><span>选择器会在采集前隐藏</span><button id="start" class="primary" type="button" disabled>开始</button></footer>
  </main>
  <section id="cropper" hidden aria-label="鼠标框选采集区域">
    <canvas id="crop-canvas" aria-label="按住鼠标拖动框选采集区域"></canvas>
    <div class="crop-actions">
      <span id="crop-size" role="status">拖动选择区域 · Esc 取消</span>
      <div class="crop-coordinates" aria-label="区域位置与尺寸（画面像素）">
        <label>X<input id="crop-x" type="number" min="0" step="1" aria-label="区域左边距（像素）"></label>
        <label>Y<input id="crop-y" type="number" min="0" step="1" aria-label="区域上边距（像素）"></label>
        <label>宽<input id="crop-width" type="number" min="2" step="1" aria-label="区域宽度（像素）"></label>
        <label>高<input id="crop-height" type="number" min="2" step="1" aria-label="区域高度（像素）"></label>
      </div>
      <div class="crop-confirm"><label><input id="crop-remember" type="checkbox" checked>记住此区域，下次预填</label><button id="crop-reset" type="button">重新框选</button><button id="crop-cancel" type="button">取消</button><button id="crop-save" class="primary" type="button" disabled>保存截图</button></div>
    </div>
    <div id="annotation-toolbar" class="annotation-toolbar" role="toolbar" aria-label="截图标注工具" hidden>
      <div class="annotation-tool-group" aria-label="标注类型">
        <button class="annotation-tool is-active" type="button" data-tool="rectangle" aria-pressed="true" title="矩形">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect></svg>
        </button>
        <button class="annotation-tool" type="button" data-tool="arrow" aria-pressed="false" title="箭头">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </button>
        <button class="annotation-tool" type="button" data-tool="pen" aria-pressed="false" title="画笔">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"></path></svg>
        </button>
        <button class="annotation-tool" type="button" data-tool="text" aria-pressed="false" title="文字">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>
        </button>
        <button class="annotation-tool" type="button" data-tool="mosaic" aria-pressed="false" title="马赛克">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect></svg>
        </button>
      </div>
      <div class="annotation-separator" aria-hidden="true"></div>
      <div id="annotation-colors" class="annotation-colors" aria-label="标注颜色">
        <button class="annotation-color is-active" type="button" data-color="#ff4d4f" aria-pressed="true" title="红色"></button>
        <button class="annotation-color" type="button" data-color="#ffd43b" aria-pressed="false" title="黄色"></button>
        <button class="annotation-color" type="button" data-color="#42a5ff" aria-pressed="false" title="蓝色"></button>
        <button class="annotation-color" type="button" data-color="#ffffff" aria-pressed="false" title="白色"></button>
        <label class="annotation-custom-color" title="自定义颜色"><input id="annotation-color" type="color" value="#ff4d4f" aria-label="自定义标注颜色"></label>
      </div>
      <select id="annotation-width" class="annotation-width" aria-label="线条粗细" title="线条粗细">
        <option value="2">细</option><option value="4" selected>中</option><option value="8">粗</option>
      </select>
      <div class="annotation-separator" aria-hidden="true"></div>
      <button id="annotation-undo" type="button" class="annotation-command" disabled title="撤销">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>
      </button>
      <button id="annotation-redo" type="button" class="annotation-command" disabled title="重做">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"></path><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg>
      </button>
      <button id="annotation-reselect" type="button" class="annotation-command" title="重新框选">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h3"></path><path d="M17 4h3v3"></path><path d="M20 17v3h-3"></path><path d="M7 20H4v-3"></path><rect x="7" y="7" width="10" height="10" rx="1"></rect></svg>
      </button>
      <button id="annotation-cancel" type="button" class="annotation-command" title="取消截图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12"></path><path d="m6 6 12 12"></path></svg>
      </button>
      <button id="annotation-save" class="primary annotation-save" type="button" title="复制并保存截图">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg><span>完成</span>
      </button>
    </div>
    <input id="annotation-text" class="annotation-text" type="text" maxlength="200" aria-label="输入标注文字" hidden>
  </section>
  <video id="source-video" muted playsinline aria-hidden="true"></video>
  <script src="captureDomain.js"></script>
  <script src="captureWindow.js"></script>
</body>
</html>
